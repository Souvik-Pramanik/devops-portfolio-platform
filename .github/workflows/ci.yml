name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devops-portfolio-platform
  ECS_CLUSTER: devops-portfolio-cluster
  ECS_SERVICE: devops-portfolio-service
  ECS_TASK_DEFINITION: devops-portfolio-platform
  CONTAINER_NAME: portfolio
  ALB_URL: http://devops-portfolio-alb-1824700790.ap-south-1.elb.amazonaws.com

jobs:

    test:
    name: Test and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Secret Detection
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: SAST scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript
          auditOn: push

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

  docker:
    name: Build & Scan Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION="${GITHUB_SHA:0:7}" \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            -t devops-portfolio-platform:${{ github.sha }} \
            .

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-portfolio-platform:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-portfolio-platform:${{ github.sha }}
          format: cyclonedx
          output: sbom.json
          exit-code: 0
          ignore-unfixed: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 14

      - name: Start container
        run: |
          docker run -d \
            --name devops-portfolio-platform \
            -p 3000:3000 \
            devops-portfolio-platform:${{ github.sha }}

      - name: Health check
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://localhost:3000/api/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs devops-portfolio-platform
          exit 1

      - name: Verify portfolio
        run: |
          curl --fail http://localhost:3000/

      - name: Stop container
        if: always()
        run: |
          docker stop devops-portfolio-platform || true

      - name: Configure AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::833822619479:role/GitHubActions-DevOpsPortfolio
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag \
            devops-portfolio-platform:${{ github.sha }} \
            ${REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}

          docker push \
            ${REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}

      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          DIGEST="$(aws ecr describe-images             --repository-name "$ECR_REPOSITORY"             --image-ids imageTag="$GITHUB_SHA"             --query 'imageDetails[0].imageDigest'             --output text)"

          cosign sign --yes "${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::833822619479:role/GitHubActions-DevOpsPortfolio
          aws-region: ${{ env.AWS_REGION }}

      - name: Download ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION \
            --query taskDefinition \
            > task-definition.json

      - name: Stamp deployment metadata
        run: |
          jq --arg version "${GITHUB_SHA:0:7}"              --arg sha "$GITHUB_SHA"              --arg env "aws-ecs"              --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)"              --arg container "$CONTAINER_NAME" '
             .containerDefinitions |= map(
               if .name == $container then
                 .environment = ((.environment // [])
                   | map(select(.name != "APP_VERSION" and .name != "GIT_SHA" and .name != "DEPLOY_ENV" and .name != "DEPLOYED_AT"))
                   + [
                     {"name":"APP_VERSION","value":$version},
                     {"name":"GIT_SHA","value":$sha},
                     {"name":"DEPLOY_ENV","value":$env},
                     {"name":"DEPLOYED_AT","value":$deployedAt}
                   ])
               else . end
             )
             | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
             ' task-definition.json > task-definition-stamped.json

          mv task-definition-stamped.json task-definition.json

      - name: Update container image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: 833822619479.dkr.ecr.ap-south-1.amazonaws.com/devops-portfolio-platform:${{ github.sha }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify ECS
        run: |
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query "services[0].{Running:runningCount,Desired:desiredCount,Status:status}" \
            --output table

  smoke-test:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Production health check
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 5 \
            "${ALB_URL}/api/health"

      - name: Production portfolio check
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 5 \
            "${ALB_URL}/"

      - name: Deployment success
        run: |
          echo "======================================"
          echo "🚀 DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "Commit: $GITHUB_SHA"
          echo "Environment: production"
          echo "ECS: $ECS_SERVICE"
          echo "======================================"