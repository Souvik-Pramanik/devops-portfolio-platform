name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

  docker:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t devops-portfolio-platform:${{ github.sha }} \
            .

      - name: Start container
        run: |
          docker run -d \
            --name devops-portfolio-platform \
            -p 3000:3000 \
            devops-portfolio-platform:${{ github.sha }}

      - name: Wait for container
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://localhost:3000/api/health; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed health check"
          docker logs devops-portfolio-platform
          exit 1

      - name: Verify health endpoint
        run: |
          curl --fail http://localhost:3000/api/health

      - name: Verify application endpoint
        run: |
          curl --fail http://localhost:3000/

      - name: Show container status
        run: |
          docker ps -a

      - name: Show container logs
        if: always()
        run: |
          docker logs devops-portfolio-platform

      - name: Stop container
        if: always()
        run: |
          docker stop devops-portfolio-platform || true