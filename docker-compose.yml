services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: devops-portfolio-platform:1.0.0

    container_name: devops-portfolio-platform

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      APP_VERSION: "1.0.0"
      PORT: 3000

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3