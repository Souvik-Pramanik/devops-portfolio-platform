name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST security scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

  docker:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t devops-portfolio-platform:${{ github.sha }} \
            .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-portfolio-platform:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Start container
        run: |
          docker run -d \
            --name devops-portfolio-platform \
            -p 3000:3000 \
            devops-portfolio-platform:${{ github.sha }}

      - name: Wait for container
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://localhost:3000/api/health; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed health check"
          docker ps -a
          docker logs devops-portfolio-platform
          exit 1

      - name: Verify health endpoint
        run: |
          curl --fail http://localhost:3000/api/health

      - name: Verify application endpoint
        run: |
          curl --fail http://localhost:3000/

      - name: Show container status
        if: always()
        run: |
          docker ps -a

      - name: Show container logs
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^devops-portfolio-platform$'; then
            docker logs devops-portfolio-platform
          else
            echo "Container was not found. Nothing to display."
          fi

      - name: Stop container
        if: always()
        run: |
          docker stop devops-portfolio-platform || true

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::833822619479:role/GitHubActions-DevOpsPortfolio
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: devops-portfolio-platform
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            devops-portfolio-platform:${IMAGE_TAG} \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

          docker tag \
            devops-portfolio-platform:${IMAGE_TAG} \
            ${REGISTRY}/${REPOSITORY}:latest

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: devops-portfolio-platform
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

          docker push \
            ${REGISTRY}/${REPOSITORY}:latest